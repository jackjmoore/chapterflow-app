<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search — jumping to matches</title>
<style>
  /* ChapterFlow tokens, copied from src/renderer/src/index.css. */
  :root {
    --space-1: 4px; --space-2: 8px; --space-3: 12px;
    --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-sm: 4px; --radius-md: 6px;
    --text-2xs: 10px; --text-xs: 11px; --text-sm: 12px; --text-md: 13px;
    --text-lg: 14px; --text-xl: 20px;
    --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-editor: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;

    /* The page keeps its own fixed paper tokens across themes. */
    --editor-bg: #faf6ec;
    --editor-surround: #e6e2d9;
    --editor-page-edge: rgba(43, 38, 32, 0.09);
    --editor-page-shadow: rgba(43, 38, 32, 0.07);
    --editor-text: #2b2620;
    --editor-muted: #8a8270;
    --editor-match-bg: #ffe999;
    --editor-match-current-bg: #ff9d4d;

    --chrome-bg: #1c1a17;
    --chrome-bg-elevated: #242119;
    --chrome-bg-sidebar: #18160f;
    --chrome-border: #35312a;
    --chrome-border-strong: #4a4438;
    --chrome-text: #e8e3d9;
    --chrome-text-heading: #f0ece2;
    --chrome-text-muted: #9c9585;
    --chrome-text-dim: #6b6558;
    --chrome-control-bg: #262319;
    --chrome-control-hover: #322d22;
    --chrome-control-active-bg: #3a3527;
    --chrome-accent: #6f95b8;
    --chrome-accent-contrast: #0d1520;
    --chrome-accent-saving: #c9a227;
    --chrome-row-hover: #221f18;
    --chrome-row-selected: #2a3846;
    --elev-1: 0 1px 2px rgb(0 0 0 / 0.22);
    --elev-2: 0 1px 2px rgb(0 0 0 / 0.22), 0 8px 20px rgb(0 0 0 / 0.3);
    --elev-3: 0 2px 4px rgb(0 0 0 / 0.3), 0 14px 34px rgb(0 0 0 / 0.4);
  }
  body.light {
    --chrome-bg: #f5f1e8;
    --chrome-bg-elevated: #ece6d8;
    --chrome-bg-sidebar: #efe9dc;
    --chrome-border: #ddd4c0;
    --chrome-border-strong: #c9bea3;
    --chrome-text: #2b2620;
    --chrome-text-heading: #1c1812;
    --chrome-text-muted: #6e6656;
    --chrome-text-dim: #948c78;
    --chrome-control-bg: #ece5d3;
    --chrome-control-hover: #e0d8c2;
    --chrome-control-active-bg: #d8cdb0;
    --chrome-accent: #3d5a7a;
    --chrome-accent-contrast: #f5f1e8;
    --chrome-accent-saving: #9c7a12;
    --chrome-row-hover: #ece5d3;
    --chrome-row-selected: #d7e0e8;
    --elev-1: 0 1px 2px rgb(43 38 32 / 0.08);
    --elev-2: 0 1px 2px rgb(43 38 32 / 0.08), 0 8px 20px rgb(43 38 32 / 0.13);
    --elev-3: 0 2px 4px rgb(43 38 32 / 0.13), 0 14px 34px rgb(43 38 32 / 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--chrome-bg); color: var(--chrome-text);
    font-family: var(--font-ui); font-size: var(--text-md); line-height: 1.45; overflow: hidden; }

  /* ── Mock chrome ─────────────────────────────────────────────────── */
  .mockbar { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); height: 44px;
    background: var(--chrome-bg-elevated); border-bottom: 1px solid var(--chrome-border); }
  .mockbar-title { font-size: var(--text-sm); color: var(--chrome-text-muted); white-space: nowrap; }
  .mockbar-mid { display: flex; align-items: center; gap: var(--space-2); margin: 0 auto; }
  .states { display: flex; border: 1px solid var(--chrome-border); border-radius: var(--radius-sm); overflow: hidden; }
  .states button { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted); background: none; border: none; padding: 4px 11px; cursor: pointer; }
  .states button + button { border-left: 1px solid var(--chrome-border); }
  .states button.is-active { background: var(--chrome-control-active-bg); color: var(--chrome-text-heading); }
  .mockbar-toggle { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: var(--chrome-control-bg); border: 1px solid var(--chrome-border);
    border-radius: var(--radius-sm); padding: 3px 10px; cursor: pointer; }
  .mockbar-toggle:hover { background: var(--chrome-control-hover); }
  .note { margin: var(--space-3) var(--space-4) 0; font-size: var(--text-xs); color: var(--chrome-text-dim);
    border-left: 2px solid var(--chrome-border-strong); padding-left: var(--space-3); max-width: 1040px; }

  /* ── The faux window ─────────────────────────────────────────────── */
  .app-frame { position: absolute; inset: 84px var(--space-4) var(--space-4);
    display: flex; flex-direction: column; border: 1px solid var(--chrome-border);
    border-radius: var(--radius-md); overflow: hidden; background: var(--chrome-bg); }
  .app-menubar { display: flex; align-items: center; gap: var(--space-4); height: 30px; padding: 0 var(--space-3);
    background: var(--chrome-bg-elevated); border-bottom: 1px solid var(--chrome-border);
    font-size: var(--text-sm); color: var(--chrome-text-muted); flex-shrink: 0; }
  .app-menubar .brand { font-weight: 600; color: var(--chrome-text-heading); }
  .app-body { flex: 1; min-height: 0; display: flex; }
  .app-rail { width: 44px; flex-shrink: 0; background: var(--chrome-bg-sidebar); border-right: 1px solid var(--chrome-border);
    display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding-top: var(--space-2); }
  .app-rail i { display: block; width: 18px; height: 18px; border-radius: var(--radius-sm); background: var(--chrome-control-bg); }
  .app-rail i.is-active { background: var(--chrome-control-active-bg); box-shadow: inset 0 0 0 1px var(--chrome-border-strong); }

  /* ── The search bar (B, as settled) ──────────────────────────────── */
  .b-strip { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3);
    background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-border); flex-shrink: 0; position: relative; z-index: 40; }
  .b-search { position: relative; flex: 1; min-width: 0; }
  .b-field { display: flex; align-items: center; gap: var(--space-2); height: 38px; padding: 0 var(--space-2) 0 var(--space-3);
    background: var(--chrome-bg-elevated); border: 1px solid var(--chrome-border-strong);
    border-left: 3px solid var(--chrome-accent); border-radius: var(--radius-md);
    box-shadow: var(--elev-2); color: var(--chrome-text-dim); cursor: text; }
  .b-field .txt { flex: 1; min-width: 0; font-size: var(--text-lg); color: var(--chrome-text-heading); }
  .b-field > .icon:first-child { color: var(--chrome-accent); }
  .b-scope { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 var(--space-2);
    font-size: var(--text-xs); color: var(--chrome-text); background: var(--chrome-control-bg);
    border: 1px solid var(--chrome-border); border-radius: 12px; cursor: pointer; }
  .trail { display: flex; gap: var(--space-1); flex-shrink: 0; }
  .trail button { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: var(--chrome-control-bg); border: 1px solid var(--chrome-border); border-radius: var(--radius-sm); padding: 3px 10px; cursor: pointer; }

  /* The match navigator that lives in the field once you are moving through
     matches: position, arrows, and the ways out. */
  .nav-group { display: inline-flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }
  .nav-count { font-size: var(--text-xs); color: var(--chrome-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nav-btn { font: inherit; font-size: var(--text-sm); line-height: 1; width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--chrome-text-muted); background: var(--chrome-control-bg);
    border: 1px solid var(--chrome-border); border-radius: var(--radius-sm); cursor: pointer; }
  .nav-btn:hover { background: var(--chrome-control-hover); color: var(--chrome-text-heading); }
  .nav-text { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: var(--chrome-control-bg); border: 1px solid var(--chrome-border);
    border-radius: var(--radius-sm); padding: 3px 9px; cursor: pointer; white-space: nowrap; }
  .nav-text:hover { background: var(--chrome-control-hover); color: var(--chrome-text-heading); }

  /* ── The dropdown (browsing state) ───────────────────────────────── */
  .b-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; }
  .menu { background: var(--chrome-bg-elevated); border: 1px solid var(--chrome-border-strong);
    border-radius: var(--radius-md); box-shadow: var(--elev-3); overflow: hidden; }
  .rail-layout { display: grid; grid-template-columns: 124px minmax(0, 1fr); }
  .rail-col { border-right: 1px solid var(--chrome-border); padding: var(--space-2) var(--space-1); }
  .rail-label { padding: 2px var(--space-2) var(--space-1); font-size: var(--text-2xs); font-weight: 600; color: var(--chrome-text-dim); }
  .rail-item { display: flex; align-items: center; gap: var(--space-1); width: 100%; padding: 3px var(--space-2);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: none; border: none; cursor: pointer; text-align: left; }
  .rail-item:hover { background: var(--chrome-row-hover); color: var(--chrome-text); }
  .rail-item.is-active { background: var(--chrome-row-selected); color: var(--chrome-text-heading); }
  .rail-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-item .n { margin-left: auto; font-size: var(--text-2xs); color: var(--chrome-text-dim); font-variant-numeric: tabular-nums; }
  .rail-item.is-empty { opacity: 0.45; cursor: default; }
  .rail-results { max-height: 300px; overflow-y: auto; }
  .menu-foot { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3);
    border-top: 1px solid var(--chrome-border); font-size: var(--text-2xs); color: var(--chrome-text-dim); }
  .menu-foot .spacer { flex: 1; }
  .param { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: var(--chrome-control-bg); border: 1px solid var(--chrome-border);
    border-radius: var(--radius-sm); padding: 3px 9px; cursor: pointer; }
  .param.is-active { background: var(--chrome-control-active-bg); color: var(--chrome-text-heading); border-color: var(--chrome-border-strong); }

  /* ── Result rows, shared by the dropdown and the docked panel ────── */
  .group-head { display: flex; align-items: center; gap: var(--space-2); width: 100%;
    padding: var(--space-2) var(--space-3); font: inherit; font-size: var(--text-xs); font-weight: 600;
    letter-spacing: 0.02em; color: var(--chrome-text-dim); background: none; border: none; text-align: left; }
  .group-head .count { font-weight: 400; }
  .hit { display: flex; gap: var(--space-2); width: 100%; position: relative;
    padding: var(--space-2) var(--space-3) var(--space-2) var(--space-4);
    background: none; border: none; cursor: pointer; text-align: left; font: inherit; }
  .hit:hover { background: var(--chrome-row-hover); }
  .hit.is-current { background: var(--chrome-row-selected); box-shadow: inset 2px 0 0 var(--chrome-accent); }
  .hit .n { flex-shrink: 0; width: 18px; font-size: var(--text-2xs); color: var(--chrome-text-dim);
    font-variant-numeric: tabular-nums; padding-top: 2px; }
  .hit .snippet { min-width: 0; font-size: var(--text-xs); color: var(--chrome-text-muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hit mark { background: color-mix(in oklab, var(--chrome-accent) 30%, transparent);
    color: var(--chrome-text-heading); border-radius: 2px; padding: 0 1px; }
  .hit.is-current mark { background: color-mix(in oklab, var(--editor-match-current-bg) 42%, transparent); }
  .hit-action { position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%);
    font: inherit; font-size: var(--text-2xs); color: var(--chrome-text-muted);
    background: var(--chrome-control-bg); border: 1px solid var(--chrome-border);
    border-radius: var(--radius-sm); padding: 2px 7px; cursor: pointer; opacity: 0; }
  .hit:hover .hit-action { opacity: 1; }

  /* ── The docked results panel (jumping state) ────────────────────── */
  .dock { width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--chrome-bg-sidebar); border-right: 1px solid var(--chrome-border); }
  .dock-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--chrome-border); }
  .dock-title { font-size: var(--text-xs); font-weight: 600; color: var(--chrome-text-heading); }
  .dock-sub { font-size: var(--text-2xs); color: var(--chrome-text-dim); }
  .dock-close { margin-left: auto; font: inherit; font-size: var(--text-2xs); color: var(--chrome-text-muted);
    background: none; border: none; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px; text-decoration-color: var(--chrome-border-strong); }
  .dock-close:hover { color: var(--chrome-text); }
  .dock-list { flex: 1; min-height: 0; overflow-y: auto; }
  .dock-replace { border-top: 1px solid var(--chrome-border); padding: var(--space-2); background: var(--chrome-bg); }
  .dock-replace-row { display: flex; gap: var(--space-1); }
  .rep-input { flex: 1; min-width: 0; height: 26px; padding: 0 var(--space-2); display: flex; align-items: center;
    font-size: var(--text-sm); color: var(--chrome-text-heading); background: var(--chrome-control-bg);
    border: 1px solid var(--chrome-border); border-radius: var(--radius-sm); }
  .rep-input.is-placeholder { color: var(--chrome-text-dim); }
  .rep-btn { font: inherit; font-size: var(--text-xs); color: var(--chrome-text); background: var(--chrome-control-bg);
    border: 1px solid var(--chrome-border); border-radius: var(--radius-sm); padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  .rep-btn:hover { background: var(--chrome-control-hover); }
  .rep-note { margin-top: var(--space-1); font-size: var(--text-2xs); color: var(--chrome-text-dim); line-height: 1.45; }

  /* ── The editor ──────────────────────────────────────────────────── */
  .app-editor { flex: 1; min-width: 0; background: var(--editor-surround); overflow-y: auto;
    display: flex; justify-content: center; padding: var(--space-5) var(--space-4); }
  .app-page { width: 560px; max-width: 100%; align-self: flex-start; background: var(--editor-bg); color: var(--editor-text);
    border: 1px solid var(--editor-page-edge); box-shadow: 0 2px 10px var(--editor-page-shadow);
    padding: 48px 56px 64px; font-family: var(--font-editor); font-size: 15px; line-height: 1.7; }
  .app-page h1 { font-size: 19px; font-weight: 600; margin-bottom: 20px; }
  .app-page p { margin-bottom: 14px; text-indent: 1.6em; }
  .app-page p:first-of-type { text-indent: 0; }
  .app-page .m { background: var(--editor-match-bg); border-radius: 2px; }
  .app-page .m.is-current { background: var(--editor-match-current-bg); box-shadow: 0 0 0 2px var(--editor-match-current-bg); }
  .doc-tab-row { display: flex; gap: var(--space-1); padding: var(--space-2) var(--space-3);
    background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-border); flex-shrink: 0; }
  .doc-tab { font: inherit; font-size: var(--text-xs); color: var(--chrome-text-muted);
    background: none; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 3px 10px; cursor: pointer; }
  .doc-tab.is-active { background: var(--chrome-control-active-bg); color: var(--chrome-text-heading); border-color: var(--chrome-border-strong); }
  .doc-tab .n { color: var(--chrome-text-dim); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .editor-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .icon { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; font-size: var(--text-2xs);
    color: var(--chrome-text-dim); background: var(--chrome-control-bg); border: 1px solid var(--chrome-border); border-radius: 3px; }
</style>
</head>
<body>

<div class="mockbar">
  <span class="mockbar-title">Search · jumping to matches · fake data</span>
  <div class="mockbar-mid">
    <div class="states" id="states">
      <button data-state="browsing">Browsing results</button>
      <button data-state="jumping" class="is-active">Jumping through matches</button>
    </div>
  </div>
  <button class="mockbar-toggle" id="themeToggle">Light theme</button>
</div>

<p class="note" id="note"></p>

<div class="app-frame" id="frame"></div>

<script>
/* ── The manuscript, and the matches in it ─────────────────────────── */
const WORD = 'orchard'

const DOCS = [
  { name: 'Prologue', paras: [
    'The house had been empty since the spring, and the orchard had gone on without anyone to count it. Frost took the low rows first, the way it always had.',
    'Maren had not seen the orchard in seven years. She had thought about it, which is not the same thing, and had told herself the difference did not matter.',
    'Her mother had kept sixty trees alive alone for eleven years. The letter said nothing about the orchard, which was how Maren knew it was about nothing else.'
  ]},
  { name: 'The Orchard', paras: [
    'She counted what the frost had taken from the orchard that winter and found the number worse than the one she had given Tomas at the harbour.',
    'The orchard ran downhill toward the sea wall, and the last four rows were salt-burned past saving. A surveyor would call it land. Her mother had called it the orchard.',
    'Tomas said the orchard was worth more as ground than as trees, and then looked as though he wished he had not.',
    'By evening she had walked every row. The orchard was smaller than the one she remembered, or she was larger, or seven years is simply long enough for both.'
  ]},
  { name: 'The Long Field', paras: [
    'Beyond the orchard wall the ground rose into gorse and nothing else, and the wind came off the water without anything to stop it.',
    'She thought of the orchard behind her as a room she had left a light on in.'
  ]}
]

/* One pass builds both the page and the results, so a count on screen can
   never disagree with the matches under it. */
const MATCHES = []
DOCS.forEach((doc, di) => {
  doc.rendered = doc.paras.map((text) => {
    // `at` is the replacer's own offset, not a fresh indexOf: a paragraph can
    // hold the word twice, and searching for it again would hand the second
    // match the first one's surroundings.
    return text.replace(new RegExp(`(${WORD})`, 'gi'), (found, _group, at) => {
      const index = MATCHES.length
      MATCHES.push({
        index,
        docIndex: di,
        docName: doc.name,
        snippet: text.slice(Math.max(0, at - 46), at) +
          `<mark>${found}</mark>` +
          text.slice(at + found.length, at + found.length + 60)
      })
      return `<span class="m" data-match="${index}">${found}</span>`
    })
  })
})
const TOTAL = MATCHES.length

const KINDS = [
  { label: 'Manuscript', n: TOTAL },
  { label: 'Documents', n: 1 },
  { label: 'Story Bible', n: 2 },
  { label: 'Notes', n: 1 },
  { label: 'Tracking', n: 0 },
  { label: 'Lexicon', n: 0 }
]

const SEARCH_ICON = '<svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14"/></svg>'
const OPTIONS_ICON = '<svg class="icon" viewBox="0 0 16 16"><path d="M2 4.5h12M2 8h12M2 11.5h12"/><circle cx="6" cy="4.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="11.5" r="1.6" fill="currentColor" stroke="none"/></svg>'

/* ── State ─────────────────────────────────────────────────────────── */
let mode = 'jumping'   // 'browsing' | 'jumping'
let current = 4        // which match is selected

const NOTES = {
  browsing: 'Browsing. The dropdown holds the rail, the results and the replace strip, and it covers the page while it is open. Choosing a match, or pressing Enter, hands the manuscript back.',
  jumping: 'Jumping. The results have moved into a panel of their own, so the whole page is visible while you move through the matches. The field keeps the position and the arrows, the current match is the orange one, and every match stays one click away. Use the up and down arrow keys, click a match, or press Escape to finish.'
}

/* ── Pieces ────────────────────────────────────────────────────────── */
function matchesFor(docIndex) {
  return MATCHES.filter((m) => m.docIndex === docIndex)
}

function hitRow(m, withAction) {
  return `<button class="hit ${m.index === current ? 'is-current' : ''}" data-goto="${m.index}">
    <span class="n">${m.index + 1}</span>
    <span class="snippet">…${m.snippet}…</span>
    ${withAction ? '<span class="hit-action">Replace here</span>' : ''}
  </button>`
}

function groupedHits(withAction) {
  return DOCS.map((doc, di) => {
    const rows = matchesFor(di)
    if (rows.length === 0) return ''
    return `<div class="group-head"><span>${doc.name}</span><span class="count">${rows.length}</span></div>
      ${rows.map((m) => hitRow(m, withAction)).join('')}`
  }).join('')
}

function railCol() {
  return `<div class="rail-col">
    <div class="rail-label">Look in</div>
    <button class="rail-item"><span class="nm">Everything</span><span class="n">${TOTAL + 4}</span></button>
    ${KINDS.map((k) => `<button class="rail-item ${k.label === 'Manuscript' ? 'is-active' : ''} ${k.n === 0 ? 'is-empty' : ''}">
      <span class="nm">${k.label}</span><span class="n">${k.n}</span></button>`).join('')}
  </div>`
}

function dropdown() {
  return `<div class="b-menu"><div class="menu">
    <div class="rail-layout">
      ${railCol()}
      <div class="rail-results">${groupedHits(true)}</div>
    </div>
    <div class="dock-replace" style="border-radius:0">
      <div class="dock-replace-row">
        <span class="rep-input is-placeholder">Replace matches with…</span>
        <button class="rep-btn">Replace this one</button>
        <button class="rep-btn">Replace all ${TOTAL}</button>
      </div>
      <p class="rep-note">Replacing changes the manuscript only. The other four results are records, so they are left as they are.</p>
    </div>
    <div class="menu-foot">
      <button class="param">Match case</button>
      <button class="param is-active">Whole words</button>
      <button class="param">Regular expression</button>
      <span class="spacer"></span>
      <span><span class="kbd">Enter</span> to jump to a match</span>
    </div>
  </div></div>`
}

/* The field: a plain search box while browsing, and a navigator while
   jumping, so the same control carries the position and the way out. */
function field() {
  const navigator = mode === 'jumping'
    ? `<span class="nav-group">
         <span class="nav-count">Match ${current + 1} of ${TOTAL}</span>
         <button class="nav-btn" data-step="-1" title="Previous match">↑</button>
         <button class="nav-btn" data-step="1" title="Next match">↓</button>
         <button class="nav-text" data-mode="browsing">All results</button>
         <button class="nav-text" data-done>Done</button>
       </span>`
    : `<span class="b-scope">The whole project ▾</span><span class="kbd">Ctrl F</span>`
  return `<div class="b-field">
    ${SEARCH_ICON}
    <span class="txt">${WORD}</span>
    ${navigator}
    ${OPTIONS_ICON}
  </div>`
}

function editorColumn() {
  const doc = DOCS[MATCHES[current].docIndex]
  const tabs = DOCS.map((d, di) => `<button class="doc-tab ${di === MATCHES[current].docIndex ? 'is-active' : ''}" data-doc="${di}">
    ${d.name}<span class="n">${matchesFor(di).length}</span></button>`).join('')
  const page = `<div class="app-page">
    <h1>${doc.name}</h1>
    ${doc.rendered.map((p) => `<p>${p}</p>`).join('')}
  </div>`
  return `<div class="editor-col">
    ${mode === 'jumping' ? `<div class="doc-tab-row">${tabs}</div>` : ''}
    <div class="app-editor" id="editor">${page}</div>
  </div>`
}

function render() {
  document.getElementById('note').textContent = NOTES[mode]
  document.getElementById('frame').innerHTML = `
    <div class="app-menubar"><span class="brand">ChapterFlow</span><span>File</span><span>Edit</span><span>View</span><span>Project</span></div>
    <div class="b-strip">
      <div class="b-search">${field()}${mode === 'browsing' ? dropdown() : ''}</div>
      <div class="trail"><button>Editor</button><button>Outliner</button><button>Corkboard</button></div>
    </div>
    <div class="app-body">
      <div class="app-rail"><i class="is-active"></i><i></i><i></i><i></i><i></i></div>
      ${mode === 'jumping' ? `
        <div class="dock">
          <div class="dock-head">
            <span class="dock-title">${TOTAL} matches</span>
            <span class="dock-sub">in the manuscript</span>
            <button class="dock-close" data-done>Close</button>
          </div>
          <div class="dock-list" id="dockList">${groupedHits(true)}</div>
          <div class="dock-replace">
            <div class="dock-replace-row">
              <span class="rep-input is-placeholder">Replace with…</span>
              <button class="rep-btn">This one</button>
              <button class="rep-btn">All ${TOTAL}</button>
            </div>
            <p class="rep-note">Replacing changes the manuscript only.</p>
          </div>
        </div>` : ''}
      ${editorColumn()}
    </div>`

  if (mode === 'jumping') {
    // The selected match is marked in the page and brought into view, and the
    // matching row is scrolled into view in the panel, so the two never drift.
    const mark = document.querySelector(`.app-page [data-match="${current}"]`)
    if (mark) {
      mark.classList.add('is-current')
      mark.scrollIntoView({ block: 'center' })
    }
    document.querySelector('.hit.is-current')?.scrollIntoView({ block: 'nearest' })
  }
}

/* ── Wiring ────────────────────────────────────────────────────────── */
function step(by) {
  current = (current + by + TOTAL) % TOTAL
  mode = 'jumping'
  render()
  syncStateButtons()
}

function syncStateButtons() {
  document.querySelectorAll('#states button').forEach((b) => b.classList.toggle('is-active', b.dataset.state === mode))
}

document.getElementById('states').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-state]')
  if (!btn) return
  mode = btn.dataset.state
  render()
  syncStateButtons()
})

document.addEventListener('click', (e) => {
  const goto = e.target.closest('[data-goto]')
  if (goto) {
    current = Number(goto.dataset.goto)
    mode = 'jumping'
    render()
    syncStateButtons()
    return
  }
  const stepBtn = e.target.closest('[data-step]')
  if (stepBtn) { step(Number(stepBtn.dataset.step)); return }
  const modeBtn = e.target.closest('[data-mode]')
  if (modeBtn) { mode = modeBtn.dataset.mode; render(); syncStateButtons(); return }
  if (e.target.closest('[data-done]')) { mode = 'browsing'; render(); syncStateButtons(); return }
  const docTab = e.target.closest('[data-doc]')
  if (docTab) {
    const first = matchesFor(Number(docTab.dataset.doc))[0]
    if (first) { current = first.index; render() }
  }
})

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); step(1) }
  else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1) }
  else if (e.key === 'Escape') { mode = 'browsing'; render(); syncStateButtons() }
})

document.getElementById('themeToggle').addEventListener('click', (e) => {
  const light = document.body.classList.toggle('light')
  e.target.textContent = light ? 'Dark theme' : 'Light theme'
})

render()
{
  const h = location.hash.slice(1)
  if (h.includes('browsing')) { mode = 'browsing'; render(); syncStateButtons() }
  if (h.includes('light')) document.getElementById('themeToggle').click()
}
</script>
</body>
</html>
